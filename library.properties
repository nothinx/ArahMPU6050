sentence=Pelacak arah hadap (heading) berbahasa Indonesia dari IMU MPU6050.
paragraph=Arah 0-360 derajat, mata angin, selisih ke sudut tujuan, dan kemiringan. Sampling FIFO 100 Hz (tahan loop lambat), kompensasi kemiringan, dan koreksi bias gyro otomatis. Bekerja di AVR (Uno, Nano, Mega), ESP32, dan STM32 (Blackpill, Bluepill). Arah bersifat relatif karena MPU6050 tidak memiliki magnetometer. English: MPU6050 heading, yaw, compass direction, turn to angle, gyro drift correction, tilt.
